version: "3.9"
networks:
  wasp-network:
    driver: bridge

services:
  #####################################################
  # Reverse Proxy (needed to rewrite dashboard route) #
  #####################################################

  traefik:
    container_name: traefik
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  ################
  # L1 Localnode #
  ################

  l1-localnet:
    image: iotaledger/iota-tools:devnet
    container_name: l1-localnet
    networks:
      - wasp-network
    ports:
      - "9000:9000"    # JSON-RPC API
      - "9123:9123"    # Faucet
    restart: unless-stopped
    command:
      - iota
      - start
      - --force-regenesis
      - --epoch-duration-ms=60000
      - --with-faucet
      - --faucet-amount=1000000000000000
    healthcheck:
      test: ["CMD", "curl", "-sf", "-H", "Content-Type: application/json", "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"iota_getLatestCheckpointSequenceNumber\"}", "http://localhost:9000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ########
  # WASP #
  ########

  wasp:
    container_name: wasp
    image: iotaledger/wasp:latest

    build:
      context: ../../
      dockerfile: Dockerfile
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    restart: on-failure:1
    stop_grace_period: 5m
    networks:
      - wasp-network
    depends_on:
      l1-localnet:
        condition: service_healthy
    ports:
      - "2112:2112/tcp" # Prometheus
      - "4000:4000/tcp" # Peering
      - "9090:9090/tcp" # WebAPI
      - "6060:6060/tcp" # Profiling
    cap_drop:
      - ALL
    volumes:
      - wasp-db:/app/waspdb
    command:
      - "--webapi.auth.scheme=none"
      - "--l1.httpURL=http://l1-localnet:9000"
      - "--l1.websocketURL=ws://l1-localnet:9000"
      - "--logger.level=debug"
      - "--db.chainState.path=/app/waspdb/chains/data"
      - "--p2p.identity.filePath=/app/waspdb/identity/identity.key"
      - "--p2p.db.path=/app/waspdb/p2pstore"
      - "--registries.chains.filePath=/app/waspdb/chains/chain_registry.json"
      - "--registries.dkShares.path=/app/waspdb/dkshares"
      - "--registries.trustedPeers.filePath=/app/waspdb/trusted_peers.json"
      - "--registries.consensusState.path=/app/waspdb/chains/consensus"
      - "--wal.path=/app/waspdb/wal"
      - "--profiling.enabled=false"
      - "--profiling.bindAddress=0.0.0.0:6060"
    environment:
      - DEBUG=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  #############################
  # Deploy Move Contract (L1) #
  #############################

  deploy-move-contract:
    build:
      context: ../../
      dockerfile: tools/local-setup/Dockerfile.wasp-cli-runner
    container_name: deploy-move-contract
    networks:
      - wasp-network
    depends_on:
      l1-localnet:
        condition: service_healthy
    restart: "no"
    volumes:
      - ../../:/wasp-src
    working_dir: /wasp-src
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        echo "Initializing wallet and config..."
        /usr/local/bin/wasp-cli wallet provider unsafe_inmemory_testing_seed
        /usr/local/bin/wasp-cli wallet init
        /usr/local/bin/wasp-cli set l1.apiaddress http://l1-localnet:9000
        /usr/local/bin/wasp-cli set l1.faucetaddress http://l1-localnet:9123/gas
        /usr/local/bin/wasp-cli wasp add wasp0 http://wasp:9090
        /usr/local/bin/wasp-cli wallet request-funds
        sleep 10

        echo "Deploying ISC Move package to L1..."
        /usr/local/bin/wasp-cli chain deploy-move-contract

        echo "Move contract deployment completed successfully!"

  ##########################
  # Activate Chain on Wasp #
  ##########################

  activate-chain:
    build:
      context: ../../
      dockerfile: tools/local-setup/Dockerfile.wasp-cli-runner
    container_name: activate-chain
    networks:
      - wasp-network
    depends_on:
      wasp:
        condition: service_healthy
    restart: "no"
    volumes:
      - ../../:/wasp-src
    working_dir: /wasp-src
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        echo "Waiting for wasp service to be ready..."
        while ! curl -sf http://wasp:9090/health > /dev/null 2>&1; do
          echo "Wasp API not ready, retrying in 5 seconds..."
          sleep 5
        done
        echo "Wasp health endpoint is ready!"

        echo "Re-initializing wallet and config..."
        /usr/local/bin/wasp-cli wallet provider unsafe_inmemory_testing_seed
        /usr/local/bin/wasp-cli wallet init
        /usr/local/bin/wasp-cli set l1.apiaddress http://l1-localnet:9000
        /usr/local/bin/wasp-cli set l1.faucetaddress http://l1-localnet:9123/gas
        /usr/local/bin/wasp-cli wasp add wasp0 http://wasp:9090
        /usr/local/bin/wasp-cli wallet request-funds
        sleep 10

        echo "Deploying single-node chain 'localchain'..."
        /usr/local/bin/wasp-cli --wait=120s chain deploy --chain=localchain --node=wasp0

        echo "Waiting for chain to be fully activated..."
        sleep 30

        echo "Depositing base tokens to L2..."
        /usr/local/bin/wasp-cli chain deposit base:1000000

        echo "Chain info:"
        /usr/local/bin/wasp-cli chain info

        echo "Chain activation completed successfully!"

  ##################
  # WASP Dashboard #
  ##################

  wasp-dashboard:
    container_name: wasp-dashboard
    image: iotaledger/wasp-dashboard:latest
    stop_grace_period: 5m
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_started
      wasp:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wasp-dashboard.service=wasp-dashboard"
      - "traefik.http.routers.wasp-dashboard.rule=Host(`localhost`) && (Path(`/wasp/dashboard`) || PathPrefix(`/wasp/dashboard/`))"
      - "traefik.http.routers.wasp-dashboard.entrypoints=web"
      - "traefik.http.services.wasp-dashboard.loadbalancer.server.port=80"
      - "traefik.http.routers.wasp-dashboard.middlewares=rewrite-wasp-dashboard"
      - "traefik.http.middlewares.rewrite-wasp-dashboard.stripprefix.prefixes=/wasp/dashboard"
    environment:
      - WASP_API_URL=http://localhost/wasp/api:9090
      - L1_API_URL=http://localhost:9000

volumes:
  wasp-db:
    external: true
    name: wasp-db

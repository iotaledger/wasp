  JSON:
    type: encoding/json.RawMessage
  BigInt:
    type: github.com/iotaledger/wasp/v2/clients/iotagraphql/graphqltypes.BigInt
  DateTime:
    type: time.Time
  OpenMoveTypeSignature:
    type: encoding/json.RawMessage
  MoveTypeSignature:
    type: encoding/json.RawMessage
  MoveTypeLayout:
    type: encoding/json.RawMessage
  MoveData:
    type: encoding/json.RawMessage

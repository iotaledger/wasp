query GetCoins(
	$owner: IotaAddress!,
	# @genqlient(pointer: true)
	$first: Int,
	# @genqlient(pointer: true)
	$cursor: String,
	# @genqlient(pointer: true)
	$fetchCoinType: String = "0x2::iota::IOTA",
) {
	address(address: $owner) {
		address
		coins(first: $first, after: $cursor, type: $fetchCoinType) {
			pageInfo {
				...PAGE_INFO
			}
			# @genqlient(typename: "CoinData")
			nodes {
				...COIN_DATA
			}
		}
	}
}
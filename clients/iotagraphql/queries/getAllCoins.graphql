query GetAllCoins(
	$owner: IotaAddress!,
	# @genqlient(pointer: true)
	$first: Int,
	# @genqlient(pointer: true)
	$cursor: String,
) {
	address(address: $owner) {
		address
		coins(first: $first, after: $cursor) {
			pageInfo {
				...PAGE_INFO
			}
			# @genqlient(typename: "CoinData")
			nodes {
				...COIN_DATA
			}
		}
	}
}

query GetNormalizedMoveStruct($packageId: IotaAddress!, $module: String!, $moveStruct: String!) {
	object(address: $packageId) {
		asMovePackage {
			address

			module(name: $module) {
				fileFormatVersion
				struct(name: $moveStruct) {
					...RPC_MOVE_STRUCT_FIELDS
				}
			}
		}
	}
}

fragment RPC_MOVE_STRUCT_FIELDS on MoveStruct {
	name
	abilities
	fields {
		name
		type {
			signature
		}
	}
	typeParameters {
		isPhantom
		constraints
	}
}

query GetNormalizedMoveModulesByPackage(
	$packageId: IotaAddress!,
	# @genqlient(pointer: true)
	$cursor: String,
) {
	object(address: $packageId) {
		asMovePackage {
			address

			modules(after: $cursor) {
				pageInfo {
					hasNextPage
					endCursor
				}
				nodes {
					...RPC_MOVE_MODULE_FIELDS
				}
			}
		}
	}
}

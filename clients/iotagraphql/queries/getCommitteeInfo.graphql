query GetCommitteeInfo(
	# @genqlient(pointer: true)
	$epochId: UInt53,
	# @genqlient(pointer: true)
	$after: String,
) {
	epoch(id: $epochId) {
		epochId
		validatorSet {
			activeValidators(after: $after) {
				pageInfo {
					hasNextPage
					endCursor
				}
				nodes {
					credentials {
						protocolPubKey
					}
					votingPower
				}
			}
		}
	}
}

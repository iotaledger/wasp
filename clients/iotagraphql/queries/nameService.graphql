query ResolveNameServiceAddress(
	# @genqlient(pointer: true)
	$name: String!
) {
	resolveIotaNamesAddress(name: $name) {
		address
	}
}

query ResolveNameServiceNames(
	$address: IotaAddress!,
	# @genqlient(pointer: true)
	$limit: Int,
	# @genqlient(pointer: true)
	$cursor: String,
) {
	address(address: $address) {
		iotaNamesRegistrations(first: $limit, after: $cursor) {
			pageInfo {
				hasNextPage
				endCursor
			}
			nodes {
				name
			}
		}
	}
}

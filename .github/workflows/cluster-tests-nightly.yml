name: Cluster Tests Nightly

on:
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  GOFLAGS: -mod=vendor

jobs:
  cluster-tests:
    name: Run cluster tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run cluster tests
        run: |
          make test-cluster



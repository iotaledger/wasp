name: Test

on:
  pull_request:
    branches: [develop, ql-dev, fix_graphql_legacy_types]
    paths-ignore:
      - "**/README.md"

jobs:
  build:
    name: Build only
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            go.work.sum
            **/go.sum
        id: go

      - name: Build
        run: make build

      - name: Build Tests
        # use a regex pattern which never meet any function to build all the tests
        run: go test ./... -run=XXX -tags=tests_build_only

  test-short:
    name: Test (short)
    runs-on: [self-hosted, Linux, X64, wasp]
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            go.work.sum
            **/go.sum
        id: go

      # Here used to be a make build step, but we separated it into another job

      - name: Test
        run: |
          TEST_SHORT_PKGS="$(go list ./... \
            | grep -v '/tools/cluster' \
          )" make test-short

  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            go.work.sum
            **/go.sum
        id: go

      - name: Run global scope golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
          args: --timeout 15m0s
          skip-cache: true

      - name: Run golangci-lint on wasp-cli
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: tools/wasp-cli
          version: v2.5
          args: --timeout 15m0s
          skip-cache: true
